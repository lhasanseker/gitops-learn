# Kavramsal örnek — çalışan bir cluster'a bağlı değildir.
# Amaç: FluxCD'nin GitRepository + Kustomization CRD ikilisini nasıl kullandığını göstermek.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops-learn
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/lhasanseker/gitops-learn.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  interval: 5m
  path: ./examples/kustomize/overlays/prod
  prune: true            # Git'ten silinen kaynakları cluster'dan da kaldır
  sourceRef:
    kind: GitRepository
    name: gitops-learn
  targetNamespace: monitoring
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: uptime-kuma
      namespace: monitoring
