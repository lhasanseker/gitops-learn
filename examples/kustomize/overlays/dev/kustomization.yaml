apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: uptime-kuma
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi

images:
  - name: louislam/uptime-kuma
    newTag: "1"
